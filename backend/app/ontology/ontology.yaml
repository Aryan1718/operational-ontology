  MitigationPlan:
    key: MitigationPlan
    displayName: Mitigation Plan
    pluralDisplayName: Mitigation Plans
    description: Proposed or approved mitigation response for a risk event.
    source:
      table: mitigation_plans
      primaryKeyColumn: id
    primaryKeyProperty: mitigationCode
    titleProperty: mitigationCode
    readOnly: true
    storedProperties:
      mitigationPlanId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      mitigationCode:
