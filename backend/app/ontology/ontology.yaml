        type: string
        required: false
        readOnly: true
      approvedBy:
        sourceColumn: approved_by
        type: string
        required: false
        readOnly: true
      approvedAt:
        sourceColumn: approved_at
        type: datetime
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - mitigationPlanToRiskEvent
      - mitigationPlanToMitigationSteps
      - mitigationPlanToInventoryTransfers

  MitigationStep:
    key: MitigationStep
    displayName: Mitigation Step
    pluralDisplayName: Mitigation Steps
    description: Ordered mitigation step attached to a mitigation plan.
    source:
      table: mitigation_plan_steps
      primaryKeyColumn: id
    primaryKeyProperty: mitigationStepId
    titleProperty: mitigationStepId
    readOnly: true
    storedProperties:
      mitigationStepId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      mitigationPlanId:
        sourceColumn: mitigation_plan_id
        type: string
        required: true
        readOnly: true
      stepOrder:
        sourceColumn: step_order
        type: integer
        required: true
        readOnly: true
      actionType:
        sourceColumn: action_type
        type: enum
        enum: mitigationStepActionType
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: mitigationStepStatus
        required: true
        readOnly: true
      sourceWarehouseId:
        sourceColumn: source_warehouse_id
        type: string
        required: false
        readOnly: true
      targetWarehouseId:
        sourceColumn: target_warehouse_id
        type: string
        required: false
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: false
        readOnly: true
      purchaseOrderId:
        sourceColumn: purchase_order_id
        type: string
        required: false
        readOnly: true
      shipmentId:
        sourceColumn: shipment_id
        type: string
        required: false
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: false
        readOnly: true
      productId:
        sourceColumn: product_id
        type: string
        required: false
        readOnly: true
      quantity:
        sourceColumn: quantity
        type: number
        required: false
        readOnly: true
      notes:
        sourceColumn: notes
        type: string
        required: false
        readOnly: true
