        required: false
        readOnly: true
      description:
        sourceColumn: description
        type: string
        required: false
        readOnly: true
      detectedAt:
        sourceColumn: detected_at
        type: datetime
        required: true
        readOnly: true
      resolvedAt:
        sourceColumn: resolved_at
        type: datetime
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
