        items:
          type: array
          items:
            type: object
            required:
              - partId
              - partName
              - supplierPartId
              - delayDays
              - openPurchaseOrderQuantity
              - baselineShortageQuantity
              - delayedShortageQuantity
              - shortageIncreaseQuantity
              - delayedPurchaseOrderIds
              - impactReason
