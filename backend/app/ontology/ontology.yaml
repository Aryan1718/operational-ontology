              baselineShortageQuantity:
                type: number
              delayedShortageQuantity:
                type: number
              shortageIncreaseQuantity:
                type: number
              firstBaselineShortageDate:
                type: string
                format: date
              firstDelayedShortageDate:
                type: string
                format: date
              delayedPurchaseOrderIds:
                type: array
                items:
                  type: string
