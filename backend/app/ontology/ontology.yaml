        enum: riskEventStatus
        required: true
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: false
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: false
        readOnly: true
      warehouseId:
        sourceColumn: warehouse_id
        type: string
        required: false
        readOnly: true
      shipmentId:
        sourceColumn: shipment_id
        type: string
        required: false
        readOnly: true
      delayDays:
