              - availableQuantity
              - safetyStockQuantity
              - committedOutgoingTransferQuantity
              - transferableQuantity
              - coveredQuantity
              - remainingShortage
              - estimatedTransferDays
              - estimatedArrivalDate
              - estimatedTransferCost
              - feasible
              - infeasibilityReasons
              - estimator
            properties:
