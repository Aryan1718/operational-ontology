                    requiredQuantity:
                      type: number
                    baselineFulfillableQuantity:
                      type: number
                    delayedFulfillableQuantity:
                      type: number
                    shortageQuantity:
                      type: number
              impactedPartIds:
                type: array
                items:
                  type: string
              requiredQuantity:
                type: number
              baselineFulfillableQuantity:
                type: number
              delayedFulfillableQuantity:
                type: number
              shortageQuantity:
                type: number
              shortageRatio:
                type: number
              baselineProjectedDelayDays:
                type: integer
              projectedDelayDays:
                type: integer
              estimatedOrderValue:
                type: number
              riskScore:
                type: integer
