ontology:
  key: operationalOntology
  displayName: Operational Ontology
  description: >
    Declarative ontology metadata for supply-chain operational objects and
    stored relationships backed by PostgreSQL operational tables.
  version: 1.0.0
  metadataFormatVersion: 1.0.0

settings:
  defaultPropertyReadOnly: true

enums:
  supplierStatus:
    - active
    - inactive
    - blocked
    - delayed
  partCriticality:
    - low
    - medium
    - high
    - critical
  partStatus:
    - active
    - inactive
    - discontinued
  supplierPartStatus:
    - active
    - inactive
    - blocked
  productStatus:
    - active
    - inactive
    - discontinued
  warehouseStatus:
    - active
    - inactive
    - blocked
  inventoryItemType:
    - part
    - product
  customerOrderPriority:
    - low
    - normal
    - high
    - critical
  customerOrderStatus:
    - open
    - allocated
    - partially_allocated
    - shipped
    - delivered
    - delayed
    - cancelled
  shipmentStatus:
    - planned
    - allocated
    - in_transit
    - delivered
    - delayed
    - cancelled
  purchaseOrderStatus:
    - draft
    - open
    - confirmed
    - partially_received
    - received
    - delayed
    - cancelled
  riskType:
    - supplier_delay
    - part_shortage
    - warehouse_outage
    - shipment_delay
    - quality_issue
    - demand_spike
  riskSeverity:
    - low
    - medium
    - high
    - critical
  riskEventStatus:
    - open
    - investigating
    - mitigating
    - resolved
    - cancelled
  mitigationPlanType:
    - reallocate_inventory
    - expedite_purchase_order
    - use_alternate_supplier
    - split_shipment
    - delay_order
  mitigationPlanStatus:
    - draft
    - proposed
    - approved
    - rejected
    - executing
    - executed
    - cancelled
  mitigationStepActionType:
    - reallocate_inventory
    - expedite_purchase_order
    - use_alternate_supplier
    - split_shipment
    - update_shipment_date
    - delay_order
  mitigationStepStatus:
    - pending
    - approved
    - executing
    - executed
    - failed
    - cancelled

objectTypes:
  Supplier:
    key: Supplier
    displayName: Supplier
    pluralDisplayName: Suppliers
    description: Company that supplies one or more parts.
    source:
      table: suppliers
      primaryKeyColumn: id
    primaryKeyProperty: supplierCode
    titleProperty: name
    readOnly: true
    storedProperties:
      supplierId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      supplierCode:
        sourceColumn: supplier_code
        type: string
        required: true
        readOnly: true
        searchable: true
        filterable: true
        sortable: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
        searchable: true
        filterable: true
        sortable: true
      country:
        sourceColumn: country
        type: string
        required: false
        readOnly: true
        searchable: true
        filterable: true
        sortable: true
      region:
        sourceColumn: region
        type: string
        required: false
        readOnly: true
        searchable: true
        filterable: true
        sortable: true
      status:
        sourceColumn: status
        type: enum
        enum: supplierStatus
        required: true
        readOnly: true
        searchable: true
        filterable: true
        sortable: true
      reliabilityScore:
        sourceColumn: reliability_score
        type: number
        required: false
        readOnly: true
        filterable: true
        sortable: true
      defaultLeadTimeDays:
        sourceColumn: default_lead_time_days
        type: integer
        required: false
        readOnly: true
        filterable: true
        sortable: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
        filterable: true
        sortable: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
        filterable: true
        sortable: true
    links:
      - supplierToSupplierParts
      - supplierToPurchaseOrders
      - supplierToRiskEvents
      - supplierSuppliesParts

  Part:
    key: Part
    displayName: Part
    pluralDisplayName: Parts
    description: Component supplied by suppliers and used in products.
    source:
      table: parts
      primaryKeyColumn: id
    primaryKeyProperty: partCode
    titleProperty: name
    readOnly: true
    storedProperties:
      partId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      partCode:
        sourceColumn: part_code
        type: string
        required: true
        readOnly: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
      category:
        sourceColumn: category
        type: string
        required: false
        readOnly: true
      criticality:
        sourceColumn: criticality
        type: enum
        enum: partCriticality
        required: true
        readOnly: true
      unitCost:
        sourceColumn: unit_cost
        type: currency
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: partStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - partToSupplierParts
      - partToProductPartRequirements
      - partToInventoryPositions
      - partToPurchaseOrderLines
      - partToRiskEvents
      - partUsedInProducts

  Product:
    key: Product
    displayName: Product
    pluralDisplayName: Products
    description: Finished product sold through customer orders.
    source:
      table: products
      primaryKeyColumn: id
    primaryKeyProperty: productCode
    titleProperty: name
    readOnly: true
    storedProperties:
      productId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      productCode:
        sourceColumn: product_code
        type: string
        required: true
        readOnly: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
      category:
        sourceColumn: category
        type: string
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: productStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - productToProductPartRequirements
      - productToOrderLines
      - productIncludedInCustomerOrders

  Warehouse:
    key: Warehouse
    displayName: Warehouse
    pluralDisplayName: Warehouses
    description: Storage or fulfillment location.
    source:
      table: warehouses
      primaryKeyColumn: id
    primaryKeyProperty: warehouseCode
    titleProperty: name
    readOnly: true
    storedProperties:
      warehouseId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      warehouseCode:
        sourceColumn: warehouse_code
        type: string
        required: true
        readOnly: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
      city:
        sourceColumn: city
        type: string
        required: false
        readOnly: true
      state:
        sourceColumn: state
        type: string
        required: false
        readOnly: true
      country:
        sourceColumn: country
        type: string
        required: false
        readOnly: true
      region:
        sourceColumn: region
        type: string
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: warehouseStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - warehouseToInventoryPositions
      - warehouseToShipments
      - warehouseStoresParts
      - warehouseToInventoryTransferSources
      - warehouseToInventoryTransferDestinations

  SupplierPart:
    key: SupplierPart
    displayName: Supplier Part
    pluralDisplayName: Supplier Parts
    description: Stored supplier-to-part supply relationship.
    source:
      table: supplier_parts
      primaryKeyColumn: id
    primaryKeyProperty: supplierPartId
    titleProperty: supplierPartId
    readOnly: true
    storedProperties:
      supplierPartId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      supplierPartCode:
        sourceColumn: supplier_part_code
        type: string
        required: false
        readOnly: true
      isPrimarySupplier:
        sourceColumn: is_primary_supplier
        type: boolean
        required: true
        readOnly: true
      leadTimeDays:
        sourceColumn: lead_time_days
        type: integer
        required: false
        readOnly: true
      minimumOrderQuantity:
        sourceColumn: minimum_order_quantity
        type: number
        required: false
        readOnly: true
      unitCost:
        sourceColumn: unit_cost
        type: currency
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: supplierPartStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - supplierPartToSupplier
      - supplierPartToPart

  ProductPartRequirement:
    key: ProductPartRequirement
    displayName: Product Part Requirement
    pluralDisplayName: Product Part Requirements
    description: One bill-of-materials requirement linking a product to a part.
    source:
      table: product_bom_items
      primaryKeyColumn: id
    primaryKeyProperty: productPartRequirementId
    titleProperty: productPartRequirementId
    readOnly: true
    storedProperties:
      productPartRequirementId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      productId:
        sourceColumn: product_id
        type: string
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      quantityRequired:
        sourceColumn: quantity_required
        type: number
        required: true
        readOnly: true
      isCritical:
        sourceColumn: is_critical
        type: boolean
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - productPartRequirementToProduct
      - productPartRequirementToPart

  InventoryPosition:
    key: InventoryPosition
    displayName: Inventory Position
    pluralDisplayName: Inventory Positions
    description: Part inventory stored at a warehouse.
    source:
      table: inventory
      primaryKeyColumn: id
      rowFilter:
        item_type: part
    primaryKeyProperty: inventoryPositionId
    titleProperty: inventoryPositionId
    readOnly: true
    storedProperties:
      inventoryPositionId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      warehouseId:
        sourceColumn: warehouse_id
        type: string
        required: true
        readOnly: true
      itemType:
        sourceColumn: item_type
        type: enum
        enum: inventoryItemType
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      onHandQuantity:
        sourceColumn: on_hand_quantity
        type: number
        required: true
        readOnly: true
      reservedQuantity:
        sourceColumn: reserved_quantity
        type: number
        required: true
        readOnly: true
      safetyStockQuantity:
        sourceColumn: safety_stock_quantity
        type: number
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - inventoryPositionToWarehouse
      - inventoryPositionToPart

  CustomerOrder:
    key: CustomerOrder
    displayName: Customer Order
    pluralDisplayName: Customer Orders
    description: Customer demand record for one or more products.
    source:
      table: customer_orders
