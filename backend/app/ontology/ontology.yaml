ontology:
  key: operationalOntology
  displayName: Operational Ontology
  description: >
    Declarative ontology metadata for supply-chain operational objects and
    stored relationships backed by PostgreSQL operational tables.
  version: 1.0.0
  metadataFormatVersion: 1.0.0

settings:
  defaultPropertyReadOnly: true

enums:
  supplierStatus:
    - active
    - inactive
    - blocked
    - delayed
  partCriticality:
    - low
    - medium
    - high
    - critical
  partStatus:
    - active
    - inactive
    - discontinued
  supplierPartStatus:
    - active
    - inactive
    - blocked
  productStatus:
    - active
    - inactive
    - discontinued
  warehouseStatus:
    - active
    - inactive
    - blocked
  inventoryItemType:
    - part
    - product
  customerOrderPriority:
    - low
    - normal
    - high
    - critical
  customerOrderStatus:
    - open
    - allocated
    - partially_allocated
    - shipped
    - delivered
    - delayed
    - cancelled
  shipmentStatus:
    - planned
    - allocated
    - in_transit
    - delivered
    - delayed
    - cancelled
  purchaseOrderStatus:
    - draft
    - open
    - confirmed
    - partially_received
    - received
    - delayed
    - cancelled
  riskType:
    - supplier_delay
    - part_shortage
    - warehouse_outage
    - shipment_delay
    - quality_issue
    - demand_spike
  riskSeverity:
    - low
    - medium
    - high
    - critical
  riskEventStatus:
    - open
    - investigating
    - mitigating
    - resolved
    - cancelled
  mitigationPlanType:
    - reallocate_inventory
    - expedite_purchase_order
    - use_alternate_supplier
    - split_shipment
    - delay_order
  mitigationPlanStatus:
    - draft
    - proposed
    - approved
    - rejected
    - executing
    - executed
    - cancelled
  mitigationStepActionType:
    - reallocate_inventory
    - expedite_purchase_order
    - use_alternate_supplier
    - split_shipment
    - update_shipment_date
    - delay_order
  mitigationStepStatus:
    - pending
    - approved
    - executing
    - executed
    - failed
    - cancelled

objectTypes:
  Supplier:
    key: Supplier
    displayName: Supplier
    pluralDisplayName: Suppliers
    description: Company that supplies one or more parts.
    source:
      table: suppliers
      primaryKeyColumn: id
    primaryKeyProperty: supplierId
    titleProperty: name
    readOnly: true
    storedProperties:
      supplierId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      supplierCode:
        sourceColumn: supplier_code
        type: string
        required: true
        readOnly: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
      country:
        sourceColumn: country
        type: string
        required: false
        readOnly: true
      region:
        sourceColumn: region
        type: string
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: supplierStatus
        required: true
        readOnly: true
      reliabilityScore:
        sourceColumn: reliability_score
        type: number
        required: false
        readOnly: true
      defaultLeadTimeDays:
        sourceColumn: default_lead_time_days
        type: integer
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - supplierToSupplierParts
      - supplierToPurchaseOrders
      - supplierToRiskEvents
      - supplierSuppliesParts

  Part:
    key: Part
    displayName: Part
    pluralDisplayName: Parts
    description: Component supplied by suppliers and used in products.
    source:
      table: parts
      primaryKeyColumn: id
    primaryKeyProperty: partId
    titleProperty: name
    readOnly: true
    storedProperties:
      partId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      partCode:
        sourceColumn: part_code
        type: string
        required: true
        readOnly: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
      category:
        sourceColumn: category
        type: string
        required: false
        readOnly: true
      criticality:
        sourceColumn: criticality
        type: enum
        enum: partCriticality
        required: true
        readOnly: true
      unitCost:
        sourceColumn: unit_cost
        type: currency
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: partStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - partToSupplierParts
      - partToProductPartRequirements
      - partToInventoryPositions
      - partToPurchaseOrderLines
      - partToRiskEvents
      - partUsedInProducts

  Product:
    key: Product
    displayName: Product
    pluralDisplayName: Products
    description: Finished product sold through customer orders.
    source:
      table: products
      primaryKeyColumn: id
    primaryKeyProperty: productId
    titleProperty: name
    readOnly: true
    storedProperties:
      productId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      productCode:
        sourceColumn: product_code
        type: string
        required: true
        readOnly: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
      category:
        sourceColumn: category
        type: string
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: productStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - productToProductPartRequirements
      - productToOrderLines
      - productIncludedInCustomerOrders

  Warehouse:
    key: Warehouse
    displayName: Warehouse
    pluralDisplayName: Warehouses
    description: Storage or fulfillment location.
    source:
      table: warehouses
      primaryKeyColumn: id
    primaryKeyProperty: warehouseId
    titleProperty: name
    readOnly: true
    storedProperties:
      warehouseId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      warehouseCode:
        sourceColumn: warehouse_code
        type: string
        required: true
        readOnly: true
      name:
        sourceColumn: name
        type: string
        required: true
        readOnly: true
      city:
        sourceColumn: city
        type: string
        required: false
        readOnly: true
      state:
        sourceColumn: state
        type: string
        required: false
        readOnly: true
      country:
        sourceColumn: country
        type: string
        required: false
        readOnly: true
      region:
        sourceColumn: region
        type: string
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: warehouseStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - warehouseToInventoryPositions
      - warehouseToShipments
      - warehouseStoresParts
      - warehouseToInventoryTransferSources
      - warehouseToInventoryTransferDestinations

  SupplierPart:
    key: SupplierPart
    displayName: Supplier Part
    pluralDisplayName: Supplier Parts
    description: Stored supplier-to-part supply relationship.
    source:
      table: supplier_parts
      primaryKeyColumn: id
    primaryKeyProperty: supplierPartId
    titleProperty: supplierPartId
    readOnly: true
    storedProperties:
      supplierPartId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      supplierPartCode:
        sourceColumn: supplier_part_code
        type: string
        required: false
        readOnly: true
      isPrimarySupplier:
        sourceColumn: is_primary_supplier
        type: boolean
        required: true
        readOnly: true
      leadTimeDays:
        sourceColumn: lead_time_days
        type: integer
        required: false
        readOnly: true
      minimumOrderQuantity:
        sourceColumn: minimum_order_quantity
        type: number
        required: false
        readOnly: true
      unitCost:
        sourceColumn: unit_cost
        type: currency
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: supplierPartStatus
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - supplierPartToSupplier
      - supplierPartToPart

  ProductPartRequirement:
    key: ProductPartRequirement
    displayName: Product Part Requirement
    pluralDisplayName: Product Part Requirements
    description: One bill-of-materials requirement linking a product to a part.
    source:
      table: product_bom_items
      primaryKeyColumn: id
    primaryKeyProperty: productPartRequirementId
    titleProperty: productPartRequirementId
    readOnly: true
    storedProperties:
      productPartRequirementId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      productId:
        sourceColumn: product_id
        type: string
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      quantityRequired:
        sourceColumn: quantity_required
        type: number
        required: true
        readOnly: true
      isCritical:
        sourceColumn: is_critical
        type: boolean
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - productPartRequirementToProduct
      - productPartRequirementToPart

  InventoryPosition:
    key: InventoryPosition
    displayName: Inventory Position
    pluralDisplayName: Inventory Positions
    description: Part inventory stored at a warehouse.
    source:
      table: inventory
      primaryKeyColumn: id
      rowFilter:
        item_type: part
    primaryKeyProperty: inventoryPositionId
    titleProperty: inventoryPositionId
    readOnly: true
    storedProperties:
      inventoryPositionId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      warehouseId:
        sourceColumn: warehouse_id
        type: string
        required: true
        readOnly: true
      itemType:
        sourceColumn: item_type
        type: enum
        enum: inventoryItemType
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      onHandQuantity:
        sourceColumn: on_hand_quantity
        type: number
        required: true
        readOnly: true
      reservedQuantity:
        sourceColumn: reserved_quantity
        type: number
        required: true
        readOnly: true
      safetyStockQuantity:
        sourceColumn: safety_stock_quantity
        type: number
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - inventoryPositionToWarehouse
      - inventoryPositionToPart

  CustomerOrder:
    key: CustomerOrder
    displayName: Customer Order
    pluralDisplayName: Customer Orders
    description: Customer demand record for one or more products.
    source:
      table: customer_orders
      primaryKeyColumn: id
    primaryKeyProperty: customerOrderId
    titleProperty: orderCode
    readOnly: true
    storedProperties:
      customerOrderId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      orderCode:
        sourceColumn: order_code
        type: string
        required: true
        readOnly: true
      customerName:
        sourceColumn: customer_name
        type: string
        required: true
        readOnly: true
      priority:
        sourceColumn: priority
        type: enum
        enum: customerOrderPriority
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: customerOrderStatus
        required: true
        readOnly: true
      requestedDeliveryDate:
        sourceColumn: requested_delivery_date
        type: date
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - customerOrderToOrderLines
      - customerOrderToShipments

  OrderLine:
    key: OrderLine
    displayName: Order Line
    pluralDisplayName: Order Lines
    description: Product demand row within a customer order.
    source:
      table: customer_order_items
      primaryKeyColumn: id
    primaryKeyProperty: orderLineId
    titleProperty: orderLineId
    readOnly: true
    storedProperties:
      orderLineId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      orderId:
        sourceColumn: order_id
        type: string
        required: true
        readOnly: true
      productId:
        sourceColumn: product_id
        type: string
        required: true
        readOnly: true
      quantityOrdered:
        sourceColumn: quantity_ordered
        type: number
        required: true
        readOnly: true
      quantityAllocated:
        sourceColumn: quantity_allocated
        type: number
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - orderLineToCustomerOrder
      - orderLineToProduct

  Shipment:
    key: Shipment
    displayName: Shipment
    pluralDisplayName: Shipments
    description: Shipment record fulfilling a customer order from a warehouse.
    source:
      table: shipments
      primaryKeyColumn: id
    primaryKeyProperty: shipmentId
    titleProperty: shipmentCode
    readOnly: true
    storedProperties:
      shipmentId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      shipmentCode:
        sourceColumn: shipment_code
        type: string
        required: true
        readOnly: true
      orderId:
        sourceColumn: order_id
        type: string
        required: true
        readOnly: true
      warehouseId:
        sourceColumn: warehouse_id
        type: string
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: shipmentStatus
        required: true
        readOnly: true
      carrier:
        sourceColumn: carrier
        type: string
        required: false
        readOnly: true
      trackingNumber:
        sourceColumn: tracking_number
        type: string
        required: false
        readOnly: true
      plannedShipDate:
        sourceColumn: planned_ship_date
        type: date
        required: false
        readOnly: true
      actualShipDate:
        sourceColumn: actual_ship_date
        type: date
        required: false
        readOnly: true
      plannedDeliveryDate:
        sourceColumn: planned_delivery_date
        type: date
        required: false
        readOnly: true
      actualDeliveryDate:
        sourceColumn: actual_delivery_date
        type: date
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - shipmentToCustomerOrder
      - shipmentToWarehouse

  PurchaseOrder:
    key: PurchaseOrder
    displayName: Purchase Order
    pluralDisplayName: Purchase Orders
    description: Order placed with a supplier for one or more parts.
    source:
      table: purchase_orders
      primaryKeyColumn: id
    primaryKeyProperty: purchaseOrderId
    titleProperty: purchaseOrderCode
    readOnly: true
    storedProperties:
      purchaseOrderId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      purchaseOrderCode:
        sourceColumn: purchase_order_code
        type: string
        required: true
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: purchaseOrderStatus
        required: true
        readOnly: true
      orderDate:
        sourceColumn: order_date
        type: date
        required: true
        readOnly: true
      expectedDeliveryDate:
        sourceColumn: expected_delivery_date
        type: date
        required: false
        readOnly: true
      actualDeliveryDate:
        sourceColumn: actual_delivery_date
        type: date
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - purchaseOrderToSupplier
      - purchaseOrderToPurchaseOrderLines

  PurchaseOrderLine:
    key: PurchaseOrderLine
    displayName: Purchase Order Line
    pluralDisplayName: Purchase Order Lines
    description: Part quantity row within a purchase order.
    source:
      table: purchase_order_items
      primaryKeyColumn: id
    primaryKeyProperty: purchaseOrderLineId
    titleProperty: purchaseOrderLineId
    readOnly: true
    storedProperties:
      purchaseOrderLineId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      purchaseOrderId:
        sourceColumn: purchase_order_id
        type: string
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      quantityOrdered:
        sourceColumn: quantity_ordered
        type: number
        required: true
        readOnly: true
      quantityReceived:
        sourceColumn: quantity_received
        type: number
        required: true
        readOnly: true
      unitCost:
        sourceColumn: unit_cost
        type: currency
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - purchaseOrderLineToPurchaseOrder
      - purchaseOrderLineToPart

  RiskEvent:
    key: RiskEvent
    displayName: Risk Event
    pluralDisplayName: Risk Events
    description: Operational disruption record that may reference supplier, part, warehouse, or shipment.
    source:
      table: risk_events
      primaryKeyColumn: id
    primaryKeyProperty: riskEventId
    titleProperty: riskCode
    readOnly: true
    storedProperties:
      riskEventId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      riskCode:
        sourceColumn: risk_code
        type: string
        required: true
        readOnly: true
      riskType:
        sourceColumn: risk_type
        type: enum
        enum: riskType
        required: true
        readOnly: true
      severity:
        sourceColumn: severity
        type: enum
        enum: riskSeverity
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: riskEventStatus
        required: true
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: false
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: false
        readOnly: true
      warehouseId:
        sourceColumn: warehouse_id
        type: string
        required: false
        readOnly: true
      shipmentId:
        sourceColumn: shipment_id
        type: string
        required: false
        readOnly: true
      delayDays:
        sourceColumn: delay_days
        type: integer
        required: false
        readOnly: true
      description:
        sourceColumn: description
        type: string
        required: false
        readOnly: true
      detectedAt:
        sourceColumn: detected_at
        type: datetime
        required: true
        readOnly: true
      resolvedAt:
        sourceColumn: resolved_at
        type: datetime
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - riskEventToSupplier
      - riskEventToPart
      - riskEventToWarehouse
      - riskEventToShipment
      - riskEventToMitigationPlans

  MitigationPlan:
    key: MitigationPlan
    displayName: Mitigation Plan
    pluralDisplayName: Mitigation Plans
    description: Proposed or approved mitigation response for a risk event.
    source:
      table: mitigation_plans
      primaryKeyColumn: id
    primaryKeyProperty: mitigationPlanId
    titleProperty: mitigationCode
    readOnly: true
    storedProperties:
      mitigationPlanId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      mitigationCode:
        sourceColumn: mitigation_code
        type: string
        required: true
        readOnly: true
      riskEventId:
        sourceColumn: risk_event_id
        type: string
        required: true
        readOnly: true
      planType:
        sourceColumn: plan_type
        type: enum
        enum: mitigationPlanType
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: mitigationPlanStatus
        required: true
        readOnly: true
      recommendedAction:
        sourceColumn: recommended_action
        type: string
        required: true
        readOnly: true
      explanation:
        sourceColumn: explanation
        type: string
        required: false
        readOnly: true
      estimatedCost:
        sourceColumn: estimated_cost
        type: currency
        required: false
        readOnly: true
      estimatedDelayReductionDays:
        sourceColumn: estimated_delay_reduction_days
        type: integer
        required: false
        readOnly: true
      confidenceScore:
        sourceColumn: confidence_score
        type: number
        required: false
        readOnly: true
      createdBy:
        sourceColumn: created_by
        type: string
        required: false
        readOnly: true
      approvedBy:
        sourceColumn: approved_by
        type: string
        required: false
        readOnly: true
      approvedAt:
        sourceColumn: approved_at
        type: datetime
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - mitigationPlanToRiskEvent
      - mitigationPlanToMitigationSteps
      - mitigationPlanToInventoryTransfers

  MitigationStep:
    key: MitigationStep
    displayName: Mitigation Step
    pluralDisplayName: Mitigation Steps
    description: Ordered mitigation step attached to a mitigation plan.
    source:
      table: mitigation_plan_steps
      primaryKeyColumn: id
    primaryKeyProperty: mitigationStepId
    titleProperty: mitigationStepId
    readOnly: true
    storedProperties:
      mitigationStepId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      mitigationPlanId:
        sourceColumn: mitigation_plan_id
        type: string
        required: true
        readOnly: true
      stepOrder:
        sourceColumn: step_order
        type: integer
        required: true
        readOnly: true
      actionType:
        sourceColumn: action_type
        type: enum
        enum: mitigationStepActionType
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: mitigationStepStatus
        required: true
        readOnly: true
      sourceWarehouseId:
        sourceColumn: source_warehouse_id
        type: string
        required: false
        readOnly: true
      targetWarehouseId:
        sourceColumn: target_warehouse_id
        type: string
        required: false
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: false
        readOnly: true
      purchaseOrderId:
        sourceColumn: purchase_order_id
        type: string
        required: false
        readOnly: true
      shipmentId:
        sourceColumn: shipment_id
        type: string
        required: false
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: false
        readOnly: true
      productId:
        sourceColumn: product_id
        type: string
        required: false
        readOnly: true
      quantity:
        sourceColumn: quantity
        type: number
        required: false
        readOnly: true
      notes:
        sourceColumn: notes
        type: string
        required: false
        readOnly: true
      executedAt:
        sourceColumn: executed_at
        type: datetime
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - mitigationStepToMitigationPlan
      - mitigationStepToSupplier
      - mitigationStepToPurchaseOrder
      - mitigationStepToShipment
      - mitigationStepToPart
