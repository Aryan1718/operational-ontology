        type: string
        required: true
        readOnly: true
      customerName:
        sourceColumn: customer_name
        type: string
        required: true
        readOnly: true
      priority:
        sourceColumn: priority
        type: enum
        enum: customerOrderPriority
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: customerOrderStatus
        required: true
        readOnly: true
      requestedDeliveryDate:
        sourceColumn: requested_delivery_date
        type: date
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - customerOrderToOrderLines
      - customerOrderToShipments

  OrderLine:
    key: OrderLine
    displayName: Order Line
    pluralDisplayName: Order Lines
    description: Product demand row within a customer order.
    source:
      table: customer_order_items
      primaryKeyColumn: id
    primaryKeyProperty: orderLineId
    titleProperty: orderLineId
    readOnly: true
    storedProperties:
      orderLineId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      orderId:
        sourceColumn: order_id
        type: string
        required: true
        readOnly: true
      productId:
        sourceColumn: product_id
        type: string
        required: true
        readOnly: true
      quantityOrdered:
        sourceColumn: quantity_ordered
        type: number
        required: true
        readOnly: true
      quantityAllocated:
        sourceColumn: quantity_allocated
        type: number
        required: true
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - orderLineToCustomerOrder
      - orderLineToProduct

  Shipment:
    key: Shipment
    displayName: Shipment
    pluralDisplayName: Shipments
    description: Shipment record fulfilling a customer order from a warehouse.
    source:
      table: shipments
      primaryKeyColumn: id
    primaryKeyProperty: shipmentCode
    titleProperty: shipmentCode
    readOnly: true
    storedProperties:
      shipmentId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      shipmentCode:
        sourceColumn: shipment_code
        type: string
        required: true
        readOnly: true
      orderId:
        sourceColumn: order_id
        type: string
        required: true
        readOnly: true
      warehouseId:
        sourceColumn: warehouse_id
        type: string
        required: false
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: shipmentStatus
        required: true
        readOnly: true
      carrier:
        sourceColumn: carrier
        type: string
        required: false
        readOnly: true
      trackingNumber:
