        required: false
        readOnly: true
      plannedDeliveryDate:
        sourceColumn: planned_delivery_date
        type: date
        required: false
        readOnly: true
      actualDeliveryDate:
        sourceColumn: actual_delivery_date
        type: date
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - shipmentToCustomerOrder
      - shipmentToWarehouse

  PurchaseOrder:
    key: PurchaseOrder
    displayName: Purchase Order
    pluralDisplayName: Purchase Orders
    description: Order placed with a supplier for one or more parts.
    source:
      table: purchase_orders
      primaryKeyColumn: id
    primaryKeyProperty: purchaseOrderCode
    titleProperty: purchaseOrderCode
    readOnly: true
    storedProperties:
      purchaseOrderId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      purchaseOrderCode:
        sourceColumn: purchase_order_code
        type: string
        required: true
        readOnly: true
      supplierId:
        sourceColumn: supplier_id
        type: string
        required: true
        readOnly: true
      status:
        sourceColumn: status
        type: enum
        enum: purchaseOrderStatus
        required: true
        readOnly: true
      orderDate:
        sourceColumn: order_date
        type: date
        required: true
        readOnly: true
      expectedDeliveryDate:
        sourceColumn: expected_delivery_date
        type: date
        required: false
        readOnly: true
      actualDeliveryDate:
        sourceColumn: actual_delivery_date
        type: date
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
        readOnly: true
    links:
      - purchaseOrderToSupplier
      - purchaseOrderToPurchaseOrderLines

  PurchaseOrderLine:
    key: PurchaseOrderLine
    displayName: Purchase Order Line
    pluralDisplayName: Purchase Order Lines
    description: Part quantity row within a purchase order.
    source:
      table: purchase_order_items
      primaryKeyColumn: id
    primaryKeyProperty: purchaseOrderLineId
    titleProperty: purchaseOrderLineId
    readOnly: true
    storedProperties:
      purchaseOrderLineId:
        sourceColumn: id
        type: string
        required: true
        readOnly: true
      purchaseOrderId:
        sourceColumn: purchase_order_id
        type: string
        required: true
        readOnly: true
      partId:
        sourceColumn: part_id
        type: string
        required: true
        readOnly: true
      quantityOrdered:
        sourceColumn: quantity_ordered
        type: number
        required: true
        readOnly: true
      quantityReceived:
        sourceColumn: quantity_received
        type: number
        required: true
        readOnly: true
      unitCost:
        sourceColumn: unit_cost
        type: currency
        required: false
        readOnly: true
      createdAt:
        sourceColumn: created_at
        type: datetime
        required: true
        readOnly: true
      updatedAt:
        sourceColumn: updated_at
        type: datetime
        required: true
